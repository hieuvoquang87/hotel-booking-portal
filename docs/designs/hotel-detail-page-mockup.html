<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stayfinder — Hotel detail</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg-page:#F8FAFC; --bg-surface:#FFFFFF; --border:#E2E8F0; --border-strong:#CBD5E1;
  --text-primary:#0F172A; --text-secondary:#475569; --text-muted:#94A3B8;
  --accent:#2563EB; --accent-text:#1D4ED8; --accent-hover:#1D4ED8;
  --focus:#3B82F6; --success:#16A34A; --warning:#D97706; --error:#DC2626; --star:#F59E0B;
  --slate-100:#F1F5F9; --slate-50:#F8FAFC;
  --r-card:12px; --r-ctl:8px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.05);
  --shadow-md:0 6px 16px -4px rgba(15,23,42,.12), 0 2px 6px rgba(15,23,42,.06);
  --shadow-lg:0 16px 40px -8px rgba(15,23,42,.22), 0 4px 12px rgba(15,23,42,.10);
  --gutter:16px;
  font-synthesis-weight:none;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{background:var(--bg-page);min-height:100%;}
body{
  background:var(--bg-page); color:var(--text-primary);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  padding-top:56px; padding-bottom:84px;
}
@media(min-width:768px){body{padding-top:64px;}}
@media(min-width:1024px){body{padding-bottom:0;}}
h1,h2,h3,p{margin:0;}
button{font-family:inherit;}
a{color:inherit;text-decoration:none;}
ul{margin:0;padding:0;list-style:none;}
.vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
:where(button,a,input,select,[tabindex]):focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px;}

.container{max-width:1280px;margin:0 auto;padding-inline:var(--gutter);}
@media(min-width:768px){:root{--gutter:24px;}}
@media(min-width:1024px){:root{--gutter:32px;}}

.skip-link{position:fixed;left:8px;top:-48px;z-index:60;background:var(--accent);color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;transition:top .15s ease;}
.skip-link:focus{top:8px;}

/* ---------- App bar / footer ---------- */
.appbar{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--bg-surface);border-bottom:1px solid var(--border);}
.appbar-inner{height:56px;display:flex;align-items:center;}
@media(min-width:768px){.appbar-inner{height:64px;}}
.brand{display:inline-flex;align-items:center;gap:9px;font-weight:700;}
.brand-mark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;}
.brand-name{font-size:18px;letter-spacing:-.02em;color:var(--text-primary);}
.brand-name.sm{font-size:15px;}
.footer{border-top:1px solid var(--border);background:var(--bg-surface);margin-top:48px;}
.footer-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;flex-wrap:wrap;padding-block:12px;}
.build{font-size:12.5px;color:var(--text-muted);font-variant-numeric:tabular-nums;}

/* ---------- Back link ---------- */
.back-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin:14px 0 4px;
  font-size:14.5px;font-weight:600;color:var(--text-secondary);}
.back-link:hover{color:var(--accent-text);}

/* ---------- Detail grid (two-pane on lg) ---------- */
.detail-grid{display:grid;grid-template-columns:1fr;gap:24px;padding-bottom:8px;}
@media(min-width:1024px){
  .detail-grid{grid-template-columns:minmax(0,1fr) 372px;gap:40px;align-items:start;}
}
.detail-content{min-width:0;}

/* ---------- Hero photo ---------- */
.hero-photo{position:relative;aspect-ratio:16/9;background:var(--slate-100);border:1px solid var(--border);
  border-radius:16px;overflow:hidden;}
.photo-stripes{position:absolute;inset:0;background-image:repeating-linear-gradient(135deg,rgba(148,163,184,.10) 0 2px,transparent 2px 12px);}
.photo-glyph{position:absolute;inset:0;display:grid;place-items:center;color:#CBD5E1;}
.photo-cap{position:absolute;left:16px;bottom:14px;color:var(--text-secondary);font-size:13px;font-weight:600;
  letter-spacing:.02em;text-transform:uppercase;opacity:.85;}
.star-badge{position:absolute;display:inline-flex;align-items:center;gap:3px;background:rgba(255,255,255,.96);
  border-radius:999px;box-shadow:var(--shadow-sm);font-weight:700;color:var(--text-primary);font-variant-numeric:tabular-nums;}
.star-badge.lg{top:14px;right:14px;height:32px;padding:0 12px;font-size:14px;gap:4px;}
.sb-star{fill:var(--star);stroke:none;}

/* ---------- Title block ---------- */
.title-block{margin-top:20px;}
.hotel-name{font-size:30px;font-weight:700;line-height:1.15;letter-spacing:-.025em;text-wrap:balance;}
@media(min-width:768px){.hotel-name{font-size:36px;}}
.hotel-address{margin-top:8px;color:var(--text-secondary);font-size:15px;}
.rating-row{display:flex;align-items:center;gap:9px;margin-top:14px;flex-wrap:wrap;}
.star-pill{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;border-radius:999px;
  background:#FEF3C7;color:#92400E;font-size:13px;font-weight:700;white-space:nowrap;}
.star-pill .sb-star{fill:#D97706;}
.rating-row .dot{color:var(--text-muted);}
.rr-num{font-size:14px;font-weight:700;color:var(--text-primary);font-variant-numeric:tabular-nums;}
.rr-count{font-size:13.5px;color:var(--text-muted);font-variant-numeric:tabular-nums;}

/* rating stars */
.rating-stars{position:relative;display:inline-block;line-height:0;}
.rs-row{display:flex;gap:1.5px;}
.rs-row svg{display:block;fill:currentColor;}
.rs-empty{color:#E2E8F0;}
.rs-fill{position:absolute;top:0;left:0;overflow:hidden;}
.rs-full{color:var(--star);}

/* ---------- Content blocks ---------- */
.block{margin-top:30px;}
.block-title{font-size:20px;font-weight:600;letter-spacing:-.01em;margin-bottom:12px;}
@media(min-width:768px){.block-title{font-size:22px;}}
.overview{color:var(--text-secondary);font-size:16px;line-height:1.65;max-width:70ch;text-wrap:pretty;}

.amenity-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 18px;}
@media(min-width:640px){.amenity-grid{grid-template-columns:repeat(3,1fr);}}
.amenity{display:flex;align-items:center;gap:10px;font-size:14.5px;color:var(--text-primary);min-height:28px;}
.amenity-ic{display:grid;place-items:center;width:22px;height:22px;border-radius:7px;background:#EFF4FF;color:var(--accent);flex:none;}

.policy-card{border:1px solid var(--border);border-radius:var(--r-card);background:var(--bg-surface);overflow:hidden;}
.policy-row{display:flex;gap:16px;padding:13px 16px;border-bottom:1px solid var(--border);}
.policy-row:last-child{border-bottom:0;}
.policy-label{flex:0 0 110px;font-size:14px;font-weight:600;color:var(--text-primary);}
.policy-value{font-size:14px;color:var(--text-secondary);font-variant-numeric:tabular-nums;}

/* ---------- Availability panel ---------- */
.detail-rail{min-width:0;}
@media(min-width:1024px){.rail-inner{position:sticky;top:84px;}}
.avail{background:var(--bg-surface);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:var(--shadow-sm);}
.avail-title{font-size:18px;font-weight:700;letter-spacing:-.01em;}
.avail-sub{margin-top:4px;color:var(--text-secondary);font-size:13.5px;}
.date-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
@media(max-width:479px){.date-grid{grid-template-columns:1fr;}}
@media(min-width:1024px){.detail-rail .date-grid{grid-template-columns:1fr;}}
.date-field{display:flex;flex-direction:column;gap:6px;}
.date-field label{font-size:13px;font-weight:600;color:var(--text-secondary);}
.date-input{display:flex;align-items:center;gap:8px;height:46px;padding:0 12px;background:var(--bg-surface);
  border:1px solid var(--border-strong);border-radius:var(--r-ctl);}
.date-input:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.14);}
.date-input.is-err{border-color:var(--error);}
.date-ic{color:var(--text-muted);flex:none;}
.date-input input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-family:inherit;font-size:14.5px;
  color:var(--text-primary);font-variant-numeric:tabular-nums;}
.date-error{display:flex;align-items:center;gap:6px;margin-top:10px;color:var(--error);font-size:13px;font-weight:500;}
.nights-note{margin-top:10px;color:var(--text-secondary);font-size:13px;font-variant-numeric:tabular-nums;}
.avail-status{min-height:0;}
.status-line{display:inline-block;margin-top:14px;font-size:13.5px;font-weight:600;color:var(--text-primary);}
.avail-body{margin-top:14px;}
.room-list{display:flex;flex-direction:column;gap:12px;}

/* ---------- Room card ---------- */
.room-card{border:1px solid var(--border);border-radius:var(--r-card);background:var(--bg-surface);padding:14px;}
.room-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.room-type{font-size:15.5px;font-weight:600;line-height:1.3;color:var(--text-primary);text-wrap:pretty;}
.avail-badge{display:inline-flex;align-items:center;gap:4px;flex:none;height:24px;padding:0 9px;border-radius:999px;
  background:#DCFCE7;color:#15803D;font-size:12px;font-weight:700;white-space:nowrap;}
.room-meta{margin-top:6px;color:var(--text-secondary);font-size:13px;font-variant-numeric:tabular-nums;}
.room-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.pill{display:inline-flex;align-items:center;height:23px;padding:0 9px;border-radius:999px;background:var(--slate-100);
  color:var(--text-secondary);font-size:12px;font-weight:500;}
.room-price{margin-top:12px;display:flex;align-items:baseline;gap:5px;}
.rp-val{font-size:18px;font-weight:700;color:var(--text-primary);font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
.rp-unit{font-size:12.5px;color:var(--text-muted);}

/* ---------- Skeletons ---------- */
.skeleton{pointer-events:none;}
.sk-line,.sk-pill{background:linear-gradient(100deg,#EEF2F7 30%,#E2E8F0 50%,#EEF2F7 70%);background-size:200% 100%;
  animation:shimmer 1.3s linear infinite;border-radius:6px;}
.sk-line{height:12px;margin-top:10px;}
.sk-line:first-child{margin-top:0;}
.sk-line.tall{height:18px;}
.w70{width:70%;}.w55{width:55%;}.w30{width:30%;}
.sk-pills{display:flex;gap:6px;margin-top:10px;}
.sk-pill{width:64px;height:22px;border-radius:999px;}
@keyframes shimmer{to{background-position:-200% 0;}}

/* ---------- Availability states ---------- */
.avail-state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:26px 14px;
  border:1px dashed var(--border-strong);border-radius:var(--r-card);background:var(--slate-50);}
.avail-state.subtle{border-style:solid;border-color:var(--border);}
.as-icon{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#EFF4FF;color:var(--accent);margin-bottom:2px;}
.as-icon.err{background:#FEF2F2;color:var(--error);}
.as-title{font-size:15px;font-weight:600;color:var(--text-primary);}
.as-body{font-size:13.5px;color:var(--text-secondary);max-width:34ch;text-wrap:pretty;}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:var(--r-ctl);
  font-size:15px;font-weight:600;cursor:pointer;border:1px solid transparent;transition:background .15s,border-color .15s,color .15s;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-hover);}
.btn.sm{min-height:40px;padding:0 16px;font-size:14px;margin-top:4px;}

/* ---------- Sticky mobile CTA ---------- */
.sticky-cta{position:fixed;bottom:0;left:0;right:0;z-index:45;background:var(--bg-surface);border-top:1px solid var(--border);
  box-shadow:0 -6px 20px -8px rgba(15,23,42,.12);padding-bottom:max(0px,env(safe-area-inset-bottom));}
.sticky-cta-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:72px;}
.cta-meta{display:flex;align-items:baseline;gap:5px;}
.cta-from{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
.cta-unit{font-size:13px;color:var(--text-muted);}
.sticky-cta .btn{padding:0 22px;}
@media(min-width:1024px){.sticky-cta{display:none;}}

/* ---------- Not found ---------- */
.notfound{max-width:520px;margin:0 auto;min-height:60vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;gap:10px;padding:40px 20px;}
.nf-icon{display:grid;place-items:center;width:60px;height:60px;border-radius:16px;background:#EFF4FF;color:var(--accent);margin-bottom:6px;}
.nf-title{font-size:26px;font-weight:700;letter-spacing:-.02em;}
.nf-body{color:var(--text-secondary);font-size:15.5px;max-width:42ch;text-wrap:pretty;}
.notfound .btn{margin-top:14px;}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important;}
}
</style>
</head>

<script>
/* ============ Stayfinder Detail · helpers ============ */
(function () {
  const HOTELS = window.HOTELS || [];

  const AMENITY_LABEL = {
    "free Wi-Fi": "Wi-Fi", fitness_center: "Fitness center", valet_parking: "Valet parking",
    free_parking: "Free parking", pet_friendly: "Pet friendly", free_breakfast: "Free breakfast",
    laundry_service: "Laundry service", bicycle_rentals: "Bicycle rentals", beach_access: "Beach access",
    rooftop_bar: "Rooftop bar", rooftop_terrace: "Rooftop terrace", rooftop_wine_bar: "Rooftop wine bar",
    hot_tub: "Hot tub", meeting_rooms: "Meeting rooms", marina_access: "Marina access",
    afternoon_tea_lounge: "Afternoon tea lounge", michelin_restaurant: "Michelin restaurant",
    fine_dining_terrace: "Fine dining terrace", harbour_restaurant: "Harbour restaurant",
    courtyard_cafe: "Courtyard café", courtyard_lounge: "Courtyard lounge", social_lounge: "Social lounge",
    gaming_lounge: "Gaming lounge", vending_galore: "Vending machines", on_site_pub: "On-site pub",
    public_hot_spring_bath: "Hot spring bath", traditional_breakfast: "Traditional breakfast",
    luggage_storage: "Luggage storage", sky_bar: "Sky bar", restaurant: "Restaurant", pool: "Pool",
    spa: "Spa", bar: "Bar",
  };
  function humanize(a) {
    if (AMENITY_LABEL[a]) return AMENITY_LABEL[a];
    return String(a).replace(/_/g, " ").replace(/^\w/, (c) => c.toUpperCase());
  }

  const usd = (n) => "$" + Math.round(n).toLocaleString("en-US");
  const compact = (n) => Number(n).toLocaleString("en-US");

  // ---- dates ----
  function parseISO(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
  function toISO(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  // nights occupied = [checkIn, checkOut)
  function nightsBetween(checkIn, checkOut) {
    const out = [];
    let d = parseISO(checkIn);
    const end = parseISO(checkOut);
    while (d < end) { out.push(toISO(d)); d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1); }
    return out;
  }
  function fmtLong(iso) {
    if (!iso) return "";
    const d = parseISO(iso);
    return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric" });
  }

  // a room is available iff every night in [in,out) is in its available_dates
  function roomAvailable(room, nights) {
    if (!nights.length) return false;
    const set = new Set(room.available_dates || []);
    return nights.every((n) => set.has(n));
  }

  function roomMeta(r) {
    const beds = r.bed_count + " " + (r.bed_count === 1 ? "bed" : "beds");
    return [r.bed_type, beds, "Sleeps " + r.max_occupancy, r.square_footage + " sq ft"];
  }

  function addressLine(a) {
    return `${a.street}, ${a.city}, ${a.state} ${a.zip_code}, ${a.country}`;
  }
  function shortLoc(a) {
    return `${a.city}, ${a.state} · ${a.country === "USA" ? "USA" : a.country}`;
  }

  function getHotel(id) { return HOTELS.find((h) => h.id === id) || null; }
  function minPrice(h) { return Math.min(...h.rooms.map((r) => r.price_per_night)); }

  window.SFD = {
    HOTELS, humanize, usd, compact, nightsBetween, fmtLong, roomAvailable,
    roomMeta, addressLine, shortLoc, getHotel, minPrice, toISO, parseISO,
    DEMO_IN: "2026-07-10", DEMO_OUT: "2026-07-12",
  };
})();

</script>

<script type="text/babel" data-src="avail.jsx">
/* ===================== Stayfinder Detail · Availability panel ===================== */
const { useState: useStateAV, useEffect: useEffectAV, useRef: useRefAV } = React;

function AvailabilityPanel({ hotel, sim, idPrefix }) {
  const SFD = window.SFD;
  const [checkIn, setCheckIn] = useStateAV(SFD.DEMO_IN);
  const [checkOut, setCheckOut] = useStateAV(SFD.DEMO_OUT);
  const [status, setStatus] = useStateAV("loading"); // idle|loading|success|empty|error|blocked
  const [rooms, setRooms] = useStateAV([]);
  const [nonce, setNonce] = useStateAV(0);
  const reqRef = useRefAV(0);
  const timerRef = useRefAV(null);
  const firstRun = useRefAV(true);

  const valid = checkIn && checkOut;
  const ordered = valid && SFD.parseISO(checkOut) > SFD.parseISO(checkIn);
  const nights = ordered ? SFD.nightsBetween(checkIn, checkOut) : [];

  useEffectAV(() => {
    if (timerRef.current) clearTimeout(timerRef.current);

    if (!valid) { setStatus("idle"); return; }
    if (!ordered) { setStatus("blocked"); return; }

    const myReq = ++reqRef.current;
    setStatus("loading");
    // analytics
    try { console.log("track:", "availability_checked", { hotelId: hotel.id, nights: nights.length }); } catch (e) {}

    timerRef.current = setTimeout(() => {
      if (myReq !== reqRef.current) return; // stale — latest wins
      if (sim === "error") { setStatus("error"); return; }
      let avail = sim === "empty" ? [] : hotel.rooms.filter((r) => SFD.roomAvailable(r, nights));
      if (avail.length) { setRooms(avail); setStatus("success"); }
      else {
        setStatus("empty");
        try { console.log("track:", "no_rooms", { hotelId: hotel.id }); } catch (e) {}
      }
    }, 1200);

    return () => { if (timerRef.current) clearTimeout(timerRef.current); };
  }, [checkIn, checkOut, nonce]);

  const liveText =
    status === "loading" ? "Checking availability…" :
    status === "success" ? `${rooms.length} ${rooms.length === 1 ? "room" : "rooms"} available` :
    status === "empty" ? "No rooms available for these dates" :
    status === "blocked" ? "Check-out must be after check-in" :
    status === "error" ? "Couldn't load availability" : "";

  return (
    <section className="avail" aria-label="Room availability">
      <h2 className="avail-title">Room availability</h2>
      <p className="avail-sub">Select your dates to see available rooms and nightly prices.</p>

      <div className="date-grid">
        <div className="date-field">
          <label htmlFor={idPrefix + "-in"}>Check-in</label>
          <div className={"date-input" + (status === "blocked" ? " is-err" : "")}>
            <Icon name="calendar" size={18} className="date-ic" />
            <input id={idPrefix + "-in"} type="date" value={checkIn}
              onChange={(e) => setCheckIn(e.target.value)} />
          </div>
        </div>
        <div className="date-field">
          <label htmlFor={idPrefix + "-out"}>Check-out</label>
          <div className={"date-input" + (status === "blocked" ? " is-err" : "")}>
            <Icon name="calendar" size={18} className="date-ic" />
            <input id={idPrefix + "-out"} type="date" value={checkOut} min={checkIn}
              onChange={(e) => setCheckOut(e.target.value)} />
          </div>
        </div>
      </div>

      {status === "blocked" && (
        <p className="date-error"><Icon name="alert" size={14} stroke={2} />Check-out must be after check-in</p>
      )}
      {ordered && status !== "blocked" && (
        <p className="nights-note">{nights.length} {nights.length === 1 ? "night" : "nights"} · {SFD.fmtLong(checkIn)} → {SFD.fmtLong(checkOut)}</p>
      )}

      <div className="avail-status" aria-live="polite">
        {(status === "loading" || status === "success") && (
          <span className="status-line">{liveText}</span>
        )}
      </div>

      <div className="avail-body">
        {status === "idle" && <AvailIdle />}
        {status === "loading" && (
          <div className="room-list">
            <RoomSkeleton /><RoomSkeleton /><RoomSkeleton />
          </div>
        )}
        {status === "success" && (
          <div className="room-list">
            {rooms.map((r) => <RoomCard key={r.room_id} room={r} />)}
          </div>
        )}
        {status === "empty" && <AvailEmpty />}
        {status === "error" && <AvailError onRetry={() => setNonce((n) => n + 1)} />}
      </div>
    </section>
  );
}

window.AvailabilityPanel = AvailabilityPanel;

</script>

/* ===================== Stayfinder Detail · App ===================== */
const { useState: useStateApp, useEffect: useEffectApp } = React;
const SFDA = window.SFD;

function getParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}

function NotFound() {
  return (
    <main className="notfound">
      <div className="nf-icon"><Icon name="search" size={28} stroke={1.7} /></div>
      <h1 className="nf-title">Hotel not found</h1>
      <p className="nf-body">We couldn't find that hotel. It may have been removed, or the link is incorrect.</p>
      <a className="btn btn-primary" href="Stayfinder.html">Browse hotels</a>
    </main>
  );
}

function AppBar() {
  return (
    <header className="appbar">
      <div className="container appbar-inner">
        <a className="brand" href="Stayfinder.html">
          <span className="brand-mark" aria-hidden="true"><Icon name="pin" size={18} stroke={2.2} /></span>
          <span className="brand-name">Stayfinder</span>
        </a>
      </div>
    </header>
  );
}

function Footer() {
  return (
    <footer className="footer">
      <div className="container footer-inner">
        <span className="brand-name sm">Stayfinder</span>
        <span className="build">Mock UI · build 2026.06.08 · display-only preview</span>
      </div>
    </footer>
  );
}

function DetailApp() {
  const id = getParam("id") || "hotel-01";
  const sim = getParam("sim"); // 'error' | 'empty' | null
  const hotel = SFDA.getHotel(id);

  useEffectApp(() => {
    if (hotel) { try { console.log("track:", "hotel_viewed", { hotelId: hotel.id }); } catch (e) {} }
  }, [id]);

  if (!hotel) {
    return (<React.Fragment><AppBar /><NotFound /><Footer /></React.Fragment>);
  }

  const a = hotel.address;
  const pol = hotel.policies;

  function focusDates(e) {
    e.preventDefault();
    const el = document.getElementById("availability");
    if (!el) return;
    const top = el.getBoundingClientRect().top + window.scrollY - 80;
    window.scrollTo({ top, behavior: "smooth" });
    const inp = document.getElementById("m-in");
    setTimeout(() => inp && inp.focus({ preventScroll: true }), 350);
  }

  function onBack(e) {
    if (document.referrer && /Stayfinder\.html/.test(document.referrer)) {
      e.preventDefault();
      window.history.back();
    }
  }

  return (
    <React.Fragment>
      <a className="skip-link" href="#detail-main">Skip to content</a>
      <AppBar />

      <main id="detail-main">
        <div className="container">
          <a className="back-link" href="Stayfinder.html" onClick={onBack}>
            <Icon name="arrowLeft" size={18} /> Back to results
          </a>

          <div className="detail-grid">
            <div className="detail-content">
              <HeroPhoto name={hotel.name} stars={hotel.star_rating} />

              <div className="title-block">
                <h1 className="hotel-name">{hotel.name}</h1>
                <p className="hotel-address">{SFDA.addressLine(a)}</p>
                <div className="rating-row">
                  <span className="star-pill"><Icon name="star" size={13} stroke={0} className="sb-star" />{hotel.star_rating + "-star hotel"}</span>
                  <span className="dot" aria-hidden="true">·</span>
                  <RatingStars value={hotel.overall_rating} />
                  <span className="rr-num">{hotel.overall_rating.toFixed(1)}</span>
                  <span className="rr-count">{SFDA.compact(hotel.review_count)} reviews</span>
                </div>
              </div>

              <section className="block" aria-label="Overview">
                <h2 className="block-title">Overview</h2>
                <p className="overview">{hotel.description}</p>
              </section>

              <section className="block" aria-label="Amenities">
                <h2 className="block-title">Amenities</h2>
                <ul className="amenity-grid">
                  {hotel.amenities.map((am) => <AmenityItem key={am} label={SFDA.humanize(am)} />)}
                </ul>
              </section>

              <section className="block" aria-label="Policies">
                <h2 className="block-title">Policies</h2>
                <div className="policy-card">
                  <PolicyRow label="Check-in" value={pol.check_in_time} />
                  <PolicyRow label="Check-out" value={pol.check_out_time} />
                  <PolicyRow label="Cancellation" value={pol.cancellation} />
                </div>
              </section>
            </div>

            <aside className="detail-rail" id="availability">
              <div className="rail-inner">
                <AvailabilityPanel hotel={hotel} sim={sim} idPrefix="m" />
              </div>
            </aside>
          </div>
        </div>
      </main>

      <Footer />

      <div className="sticky-cta">
        <div className="container sticky-cta-inner">
          <div className="cta-meta">
            <span className="cta-from">from {SFDA.usd(SFDA.minPrice(hotel))}</span>
            <span className="cta-unit">/ night</span>
          </div>
          <button className="btn btn-primary" onClick={focusDates}>Check availability</button>
        </div>
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<DetailApp />);

</script>
</body>
</html>
